<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="glass-nav">
        <div class="logo">EventEase</div>
        <div class="student-login">
            <input type="number" id="studentIdInput" placeholder="Enter Student ID" value="1">
            <button id="loginBtn">Set Active Student</button>
        </div>
    </nav>
    <header class="hero">
        <h1>Discover & Register for Amazing Events</h1>
        <p>Your one-stop platform for campus activities.</p>
    </header>
    <main>
        <section class="events-section">
            <h2>Upcoming Events</h2>
            <div id="eventsGrid" class="events-grid">
                <!-- Events will be populated here -->
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
